<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <title>Page Not Found | Relatch</title>
  <meta name="description" content="The page you are looking for does not exist or has moved." />
  <!-- A 404 already tells crawlers not to index this, the tag is belt and braces. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ══════════════════════════════════════════════
       RESET & ROOT
       Tokens mirror index.html so this page reads as
       part of the same site.
    ══════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:   #0B1120;
      --blue:   #2563EB;
      --accent: #60A5FA;
      --white:  #F8FAFC;
      --muted:  #94A3B8;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    html, body { height: 100%; }
    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ══════════════════════════════════════════════
       NAV (matches the standalone legal pages)
    ══════════════════════════════════════════════ */
    .nf-nav {
      position: sticky; top: 0; z-index: 10;
      height: 64px; padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(11,17,32,0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .nf-nav-logo {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700; font-size: 1.35rem;
      letter-spacing: -0.04em;
      color: var(--white); text-decoration: none;
    }
    .nf-nav-logo span { color: var(--accent); }
    .nf-nav-back {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem; color: var(--muted);
      display: flex; align-items: center; gap: 0.4rem;
      text-decoration: none; transition: color 0.2s;
    }
    .nf-nav-back:hover { color: var(--white); }

    /* ══════════════════════════════════════════════
       STAGE
    ══════════════════════════════════════════════ */
    .nf-stage {
      position: relative;
      min-height: calc(100vh - 64px);
      display: flex; align-items: center; justify-content: center;
      padding: 4rem 1.5rem 6rem;
      overflow: hidden;
    }

    /* Chequered grid, deliberately near invisible, faded at the edges */
    .nf-grid {
      position: absolute; inset: 0;
      background-size: 60px 60px;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 10%, transparent 72%);
      mask-image: radial-gradient(ellipse at 50% 50%, black 10%, transparent 72%);
      pointer-events: none; z-index: 0;
    }

    /* Light blue halo behind the numerals */
    .nf-halo {
      position: absolute; left: 50%; top: 46%;
      width: 80vw; height: 60vh; max-width: 900px;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle at 50% 50%,
        rgba(37,99,235,0.26) 0%,
        rgba(96,165,250,0.15) 45%,
        transparent 72%
      );
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none; z-index: 0;
      animation: nf-breathe 8s ease-in-out infinite alternate;
    }
    @keyframes nf-breathe {
      from { opacity: 0.75; transform: translate(-50%, -50%) scale(0.96); }
      to   { opacity: 1;    transform: translate(-50%, -50%) scale(1.04); }
    }

    .nf-content { position: relative; z-index: 2; text-align: center; max-width: 34rem; }

    /* The numerals, using the landing page's cursive gradient treatment */
    .nf-code {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic; font-weight: 700;
      font-size: clamp(7rem, 22vw, 13rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      background: linear-gradient(130deg, #93c5fd 0%, #60A5FA 45%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
      animation: nf-rise 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .nf-title {
      margin-top: 0.75rem;
      font-size: clamp(1.35rem, 4vw, 1.85rem);
      font-weight: 600; letter-spacing: -0.02em;
      animation: nf-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
    }
    .nf-sub {
      margin: 0.9rem auto 0;
      max-width: 28rem;
      font-size: 1rem; font-weight: 300; line-height: 1.65;
      color: var(--muted);
      animation: nf-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.22s both;
    }
    @keyframes nf-rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .nf-actions {
      margin-top: 2.25rem;
      display: flex; align-items: center; justify-content: center;
      gap: 0.85rem; flex-wrap: wrap;
      animation: nf-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.32s both;
    }
    .nf-btn-primary {
      background: var(--blue); color: #fff;
      padding: 0.9rem 2.25rem; border-radius: 10px;
      font-size: 1rem; font-weight: 600; border: none;
      text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out), transform 120ms ease-out;
    }
    .nf-btn-primary:hover {
      background: #1d4ed8;
      box-shadow: 0 8px 28px rgba(37,99,235,0.35);
      transform: translateY(-1px);
    }
    .nf-btn-ghost {
      padding: 0.9rem 1.5rem; border-radius: 10px;
      font-size: 0.95rem; font-weight: 500;
      color: var(--muted); text-decoration: none;
      border: 1px solid rgba(255,255,255,0.12);
      transition: color 0.2s, border-color 0.2s;
    }
    .nf-btn-ghost:hover { color: var(--white); border-color: rgba(255,255,255,0.28); }

    .nf-links {
      margin-top: 2.5rem;
      display: flex; align-items: center; justify-content: center;
      gap: 1.25rem; flex-wrap: wrap;
      font-size: 0.8125rem;
      animation: nf-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.42s both;
    }
    .nf-links a { color: rgba(148,163,184,0.55); text-decoration: none; transition: color 0.2s; }
    .nf-links a:hover { color: var(--accent); }

    @media (max-width: 640px) {
      .nf-nav { padding: 0 1.25rem; }
      .nf-stage { padding: 3rem 1.25rem 4.5rem; }
      .nf-actions { flex-direction: column; width: 100%; }
      .nf-btn-primary, .nf-btn-ghost { width: 100%; justify-content: center; text-align: center; }
    }

    /* Respect users who prefer no motion */
    @media (prefers-reduced-motion: reduce) {
      .nf-code, .nf-title, .nf-sub, .nf-actions, .nf-links { animation: none; }
      .nf-halo { animation: none; }
    }
  </style>
</head>
<body>

  <nav class="nf-nav">
    <a href="/" class="nf-nav-logo">re<span>latch</span></a>
    <a href="/" class="nf-nav-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to Relatch
    </a>
  </nav>

  <main class="nf-stage">
    <div class="nf-grid" aria-hidden="true"></div>
    <div class="nf-halo" aria-hidden="true"></div>

    <div class="nf-content">
      <div class="nf-code">404</div>
      <h1 class="nf-title">This page is not here.</h1>
      <p class="nf-sub">The link may be broken or the page may have moved. Everything else is still exactly where you left it.</p>

      <div class="nf-actions">
        <a href="/" class="nf-btn-primary">
          Back to home
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </a>
        <a href="https://app.relatch.online/" target="_blank" rel="noopener" class="nf-btn-ghost">Open the app</a>
      </div>

      <div class="nf-links">
        <a href="/#how-it-works">How it works</a>
        <a href="/#faq">FAQ</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
      </div>
    </div>
  </main>

</body>
</html>
